[package]
name = "iris-tauri"
version = "0.1.1"
edition = "2024"

[dependencies]
cpal = "0.15.3"
iris-config = { path = "../crates/iris-config" }
iris-core-types = { path = "../crates/iris-core-types" }
iris-hardware = { path = "../crates/iris-hardware" }
iris-ollama = { path = "../crates/iris-ollama" }
iris-status = { path = "../crates/iris-status" }
iris-ui = { path = "../crates/iris-ui" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
whisper-rs = "0.16.0"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }
tauri = { version = "2", default-features = false, features = ["tauri-runtime-wry", "webview2-com"] }
tauri-runtime-wry = { version = "2", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "2", default-features = false, features = [] }

[crate.iris-core-types]
allowed = ["domain_types", "provenance_types", "context_types", "reply_types"]
forbidden = [
  "input_simulation",
  "clipboard_read",
  "clipboard_write",
  "process_execution",
  "runtime_network",
  "browser_automation",
  "plugin_loading",
  "accessibility_control",
  "window_control",
  "autonomous_computer_use"
]
may_receive = ["plain_domain_values"]
may_not_receive = ["RawFrame", "RawAudio", "ClipboardText", "CommandRequest"]

[crate.iris-policy]
allowed = ["static_policy_constants", "capability_absence_language"]
forbidden = [
  "input_simulation",
  "clipboard_read",
  "clipboard_write",
  "process_execution",
  "runtime_network",
  "browser_automation",
  "plugin_loading",
  "accessibility_control",
  "window_control",
  "autonomous_computer_use"
]
may_receive = ["none"]
may_not_receive = ["RawFrame", "RawAudio", "ClipboardText", "CommandRequest"]

[crate.iris-paths]
allowed = ["owned_path_validation", "typed_path_wrappers"]
forbidden = [
  "input_simulation",
  "clipboard_read",
  "clipboard_write",
  "process_execution",
  "runtime_network",
  "browser_automation",
  "plugin_loading",
  "accessibility_control",
  "window_control",
  "autonomous_computer_use",
  "arbitrary_filesystem_access"
]
may_receive = ["relative_paths"]
may_not_receive = ["CommandRequest"]

[crate.iris-redaction]
allowed = ["deterministic_text_redaction", "redaction_findings"]
forbidden = [
  "input_simulation",
  "clipboard_read",
  "clipboard_write",
  "process_execution",
  "runtime_network",
  "browser_automation",
  "plugin_loading",
  "accessibility_control",
  "window_control",
  "autonomous_computer_use"
]
may_receive = ["text"]
may_not_receive = ["RawFrame", "RawAudio", "CommandRequest"]

[crate.iris-context-gate]
allowed = ["context_gating", "provenance_labeling", "authority_assignment", "redaction_before_cognition"]
forbidden = [
  "input_simulation",
  "clipboard_read",
  "clipboard_write",
  "process_execution",
  "runtime_network",
  "browser_automation",
  "plugin_loading",
  "accessibility_control",
  "window_control",
  "autonomous_computer_use"
]
may_receive = ["direct_user_text", "future_screen_ocr_text_as_untrusted_evidence"]
may_not_receive = ["RawFrame", "RawAudio", "ClipboardText", "CommandRequest"]

[crate.iris-cognition]
allowed = ["cognition_stub", "deterministic_response", "gated_context_only"]
forbidden = [
  "input_simulation",
  "clipboard_read",
  "clipboard_write",
  "process_execution",
  "runtime_network",
  "browser_automation",
  "plugin_loading",
  "accessibility_control",
  "window_control",
  "autonomous_computer_use",
  "raw_ocr_input",
  "raw_audio_input",
  "raw_screen_frame_input"
]
may_receive = ["GatedContextBundle"]
may_not_receive = ["RawFrame", "RawOcrText", "RawAudio", "ClipboardText", "CommandRequest"]

[crate.iris-runtime]
allowed = ["safe_local_flow_coordination", "startup", "policy_status_printing"]
forbidden = [
  "input_simulation",
  "clipboard_read",
  "clipboard_write",
  "process_execution",
  "runtime_network",
  "browser_automation",
  "plugin_loading",
  "accessibility_control",
  "window_control",
  "autonomous_computer_use"
]
may_receive = ["safe_demo_input"]
may_not_receive = ["CommandRequest", "ShellCommand", "ClipboardText"]

[crate.xtask]
allowed = ["development_audit", "forbidden_api_scan", "capability_ledger_presence_check"]
forbidden = [
  "runtime_input_simulation",
  "runtime_clipboard_access",
  "runtime_network",
  "runtime_browser_automation"
]
may_receive = ["repository_files"]
may_not_receive = ["runtime_user_data"]

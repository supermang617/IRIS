# Iris Development Runtime Manifest

[manifest]
schema_version = 1
status = "local_development"
architecture = "unified_dense_multimodal"
model_agnostic = true
runner_agnostic = true

[current]
runner = "ollama"
active_model_id = "huihui_ai/qwen3.5-abliterated:9b"
text_model_id = "huihui_ai/qwen3.5-abliterated:9b"
vision_model_id = "huihui_ai/qwen3.5-abliterated:9b"
unified_text_and_vision = true
model_class = "dense_multimodal"
num_ctx = 8192
context_limit_tokens = 8192
hardware_tier = "desktop_8gb_vram"
asr_backend = "isolated_local_push_to_talk"
tts_backend = "kokoro_onnx"
memory_access = "iris_broker_retrieval_only"

[runner.ollama]
kind = "loopback_development_runner"
endpoint = "127.0.0.1:11434"
external_endpoint_allowed = false
development_only = true

[hardware.surface_studio_2_class]
system_ram_gb = 64
dedicated_vram_gb = 8
gpu_class = "rtx_4060_laptop"
thermal_policy = "conservative"
target_context_tokens = 8192
max_active_inference_models = 1

[context_shield]
strategy = "fixed_ceiling"
num_ctx = 8192
sliding_window = "oldest_context_drops_first"
allow_unbounded_context = false

[architecture_rules]
prefer_single_active_model = true
split_text_vision_pipeline = false
reject_omni_class_for_current_hardware = true
reject_moe_class_for_current_hardware = true
require_dense_model_for_current_dev = true
allow_future_revalidation = true

[safety]
runtime_external_network = "forbidden"
runtime_loopback_model_runner = "development_only"
shell_process_execution = "forbidden"
input_simulation = "forbidden"
clip_buffer_access = "absent"
plugins = "unsupported"
screen_content_authority = "evidence_only"
model_tool_authority = "none"
computer_use = "unsupported"

# Iris Runtime Manifest Example

[manifest]
schema_version = 1
status = "example"
architecture = "unified_dense_multimodal"
model_agnostic = true
runner_agnostic = true

[current]
runner = "ollama"
active_model_id = "huihui_ai/qwen3.5-abliterated"
text_model_id = "huihui_ai/qwen3.5-abliterated"
vision_model_id = "huihui_ai/qwen3.5-abliterated"
unified_text_and_vision = true
model_class = "dense_multimodal"
num_ctx = 8192
context_limit_tokens = 8192
hardware_tier = "desktop_8gb_vram"
asr_backend = "isolated_local_push_to_talk"
tts_backend = "kokoro_onnx"
memory_access = "iris_broker_retrieval_only"

[runner.ollama]
kind = "loopback_development_runner"
endpoint = "127.0.0.1:11434"
development_only = true

[architecture_rules]
prefer_single_active_model = true
text_and_vision_keys_should_match = true
split_text_vision_pipeline = false
reject_omni_class_for_current_hardware = true
reject_moe_class_for_current_hardware = true

[safety]
runtime_external_network = "forbidden"
shell_process_execution = "forbidden"
input_simulation = "forbidden"
clip_buffer_access = "absent"
plugins = "unsupported"
screen_content_authority = "evidence_only"
computer_use = "unsupported"



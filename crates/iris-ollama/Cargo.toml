[package]
name = "iris-ollama"
version.workspace = true
edition = "2024"

[dependencies]
iris-config = { path = "../iris-config" }
iris-core-types = { path = "../iris-core-types" }
iris-dynamic-context = { path = "../iris-dynamic-context" }
iris-policy = { path = "../iris-policy" }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.50.0", features = ["macros", "rt", "time"] }

[dev-dependencies]
iris-context-gate = { path = "../iris-context-gate" }
